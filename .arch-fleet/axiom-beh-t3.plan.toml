# Раунд 2 поведенческого слоя axiom: TASK-v3.md (приоритизация и защита) —
# турнир полного флота. Предусловие (волны 1–5 TASK.md) влито в main
# (846087a + 321d4f8 + 9bf4c20 + aaf3d3c).
id = "axiom-beh-t3"
package = "axiom-behavioral-layer"
pattern = "tournament"
repo = "/home/roman/axiom"

[policy]
max_parallel = 7
stop_on_gate_fail = false
require_worktree = true
merge_gate = "owner"
autonomy = "R2"

[policy.budget]
max_node_secs = 0
max_attempts = 1

[defaults]
route = "critical"
timeout_from_manifest = false
gates = [
  { contract = { allow = ["complete", "partial"] } },
  { command = { cmd = "test -d tools/properties && test -f model/properties.yaml && test -f model/rule-properties.yaml && test -f model/candidates.yaml && timeout 300 /home/roman/venv-axiom/bin/python tools/check_claims.py --verify-properties", timeout_secs = 360 } },
]

[[nodes]]
id = "t3-claude"
agent = "claude-code"
group = "t2"
timeout_secs = 7200
spec = '''
ЗАДАНИЕ: выполни задание для кодового харнесса из файла
/home/roman/Загрузки/Axiom_Spine_v1/TASK-v3.md — прочти файл целиком первым
действием (365 строк) и следуй ему буквально, включая «Приёмку»,
«Финализацию» и «Контракт результата».

Контекст площадки:
- Ты в изолированном git worktree репозитория axiom (основная копия —
  /home/roman/axiom). Пути в TASK-v3.md относительные — от корня worktree.
- git push ЗАПРЕЩЁН: работа забирается из локальных коммитов ветки worktree.
- .arch-handoff/TASK.md в worktree — от другой линии, игнорируй; твоё задание —
  только TASK-v3.md из Загрузки (путь выше).
- Python проекта: /home/roman/venv-axiom/bin/python (jax, pytest — там).
- GPU и стенд GB10 не трогать (AD-7); сеть не нужна; заглушки запрещены (C-007).
- ЗАНЯТЫЕ НОМЕРА (проверь актуальное состояние в worktree): ADR-036 (лесенка
  моделей), ADR-037 (поведенческий слой), ADR-038 (приоритизация и защита)
  заняты; правила C-001…C-051 заняты; датчики S-001…S-037 заняты. По канону
  сквозной нумерации (ADR-028) бери следующие свободные: твой ADR-038 → ADR-039,
  правило C-050 → C-052, датчики S-038+ — как свободны. Замены перечисли в
  assumptions. Предусловие (волны 1–5 TASK.md и TASK-v2.md) в main влито —
  проверь tools/sensors/, model/claims.yaml (stake/level/e2e_pair), tools/preflight.py.
- Волны 1→5, по коммиту на волну (git add -A -- . ':!.arch-handoff').
  Не укладываешься — честный partial, незавершённую волну не коммить.
- ВАЖНО: коммить каждую волну сразу; при подходе к концу бюджета времени
  сначала запиши .arch-handoff/result.json и финальный JSON, потом доработки.
- Контракт результата: финальный JSON {"status", "assumptions", "open_questions",
  "conflicts_with_prior_decisions"} в ответе и файлом .arch-handoff/result.json.
'''

