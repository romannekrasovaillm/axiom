# ПРИМЕЧАНИЕ: пути домашнего каталога заменены на `/home/user/` — гейт CI «personal paths» (AD-7).
id = "axiom-walking_skeleton"
package = "axiom"
pattern = "walking_skeleton"
# repo не задаётся: корень прогона передаётся аргументом --repo (fleet run --repo <корень> --plan <файл>)
order = []
edges = []

[skeleton]
id = "node-1"
spec = """
Реализовать дельту v1.5 скелета L3 (ADR-009, ратифицирован владельцем 2026-09-12) в каталоге net/ — чистый JAX, без MaxText (это стадия скелета, см. MODEL-L3-SKELETON §5).

ЧТО СДЕЛАТЬ (порядок обязателен, шаги независимы по проверке):

Шаг 0 — конфиг. В net/config.json добавить поля: swa_window=128, swa_share_kda_projections=true, mla_top_k=512, mla_index_heads=1, mla_index_dim=128, qat_kv_enabled=false, attn_dense_reference=true, indexer_seed=0. Пересчитать actual_param_count и active_params_per_token (счётчик параметров затронут индексером и, при выделенных проекциях, SWA-веткой), ДОБАВИТЬ строки в deviations: (1) шаринг q/k/v KDA-слоя под окно SWA — наше решение, источник (V4.1-Flash §2.2) использует отдельные проекции; (2) значение top_k адаптировано под 12 Q-голов скелета (в источнике 512 при 64 головах и контексте 1M); (3) допускается короткая плотная фаза перед sparse-режимом — источник обучал sparse с нуля на 45T токенов, переносимость на 20B не доказана. Обновить active_params_definition, если состав вычислений изменился.

Шаг 1 — MLA-слои (net/mla.py): добавить локальную SWA-ветку (n_win=128) со своими K/V-проекциями И sparse-выбор: лёгкий indexer (mla_index_heads × mla_index_dim) от своего hidden, indexer K — проекцией из латента (как в CSA2: indexer K проецируется из main KV, а не отдельным путём из hidden), скор по записям латента, отбор top-k = min(mla_top_k, T), внимание — softmax по объединению выбранных записей и окна (дубликаты снимать маской), доля смешивания окна — обучаемый скаляр на слой. Режим сжатия последовательности m>1 и кросс-слойные режимы Full/Reindex/Reuse НЕ реализовывать — они явно вне объёма (ADR-009, Alternatives 5).

Шаг 2 — плотный оракул. Существующий плотный причинный путь обязан остаться в коде и включаться флагом attn_dense_reference (сейчас он же — эталон для критерия 13 и база A/B). Не удалять и не переписывать его «заодно».

Шаг 3 — KDA-слои (net/kda.py): ветка окна на уже вычисленных q/k/v линейного слоя при swa_share_kda_projections=true (0 новых параметров). При реализации отдельными проекциями — обновить deviations и пересчитать счётчик.

Шаг 4 — FP4 латента: fake-quant латента c_t в MXFP4 (E2M1 + один E4M3 scale на 16 каналов, БЕЗ second-level global scale), де-квант перед attention; SWA KV остаётся FP8. Включается флагом qat_kv_enabled (на претрейне false). Расширить существующий QAT-тест, не ломая весовую ветку.

Шаг 5 — тесты (новые файлы, не менять смысл существующих 01–12):
13. test_13_sparse_dense_equivalence: при mla_top_k ≥ T и swa_window=0 выходы сети совпадают с плотным путём в пределах 1e-4 (fp32, CPU), независимо от натренированных весов.
14. По критерию №6: ничего не «подкручивать». Существующий test_06 остаётся единственным держателем утверждения: при выполнении — recall ≥ RECALL_MIN и только тогда допустимо снятие xfail; при частичном улучшении зафиксировать измеренные числа и оставить xfail.
15. test_14_kv_fp4: дельта toy-recall против FP8-бейзлайна ≤ 2 п.п.; при провале — откат qat_kv_enabled (тест документирует, а не маскирует).
16. test_15_cost_8k_64k: замер времени/памяти forward на 8K (не хуже 5% против плотного пути) и на 64K (строго лучше).
17. test_16_indexer_determinism: одинаковый вход + indexer_seed ⇒ идентичные top-k индексы.

Шаг 6 — прогон и отчёт: `pytest net/tests -q` (если есть GPU — также gpu_smoke); в отчёте — числа по каждому из критериев 13–17, полный результат сьюта, git-хэш. Тесты, требующие GPU, скипаются с явной причиной (как сейчас).

ОГРАНИЧЕНИЯ:
- Веса и датасеты не копировать в рабочий каталог: канонически /home/user/gb10-shared, в репозитории только симлинки (C-032/C-033). Ничего тяжёлого не скачивать.
- Бюджет параметров 0,9–1,2B держать; active_params_per_token пересчитать по согласованному определению (net/config.json.active_params_definition).
- Плотный путь — дефолт до снятия гейта A4: режим по умолчанию не должен менять численное поведение существующих тестов 01–12.
- Детерминизм: все новые источники случайности — через indexer_seed/существующий seed-пиннинг.
- Не менять ARCHITECTURE-SPINE.md, docs/adr/, docs/specs/, model/, CONSTRAINTS.yaml — это зона архитектора. Если спека кажется неполной — остановиться и записать вопрос в отчёт, а не додумывать.
- Правило C-035 (декларативность механики в net/config.json) активируется архитектором после мержа дельты; исполнять его как требование к конфигу нужно уже сейчас (поля из Шага 0).

ФИНАЛИЗАЦИЯ: по завершении — git-коммит с сообщением вида `feat(net): дельта v1.5 — SWA-ветка, sparse-выбор в MLA, FP4 латента (ADR-009)`, включающий только net/ (код и тесты). В отчёте — status, что сделано, измеренные числа критериев 13–17, что не сделано и почему, открытые вопросы."""

[[skeleton.gates]]

