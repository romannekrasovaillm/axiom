allow = ["complete"]

[[skeleton.gates]]

[skeleton.gates.fitness]

[policy]
max_parallel = 8
stop_on_gate_fail = true
autonomy = "R2"
merge_gate = "owner"
require_worktree = true

[policy.budget]
max_node_secs = 0
max_attempts = 0

[defaults]
route = "Critical"
timeout_from_manifest = true
on_fail = "block"

