# Рубрика качества handoff-пакета кодовому агенту (BMAD epic-context + headless-контракт,
# docs/SOURCE_BRIEF.md §A.3): пакет должен позволить реализацию без доступа к исходным документам.
name: handoff_quality
description: "Качество handoff-пакета кодовому харнессу — epic-context, инварианты, критерии приёмки, headless-контракт результата, план отката"
scale_max: 5
origin: anchor
criteria:
  - id: epic_context
    name: Полнота epic-context
    description: "Дистиллят 800–1500 токенов: по смыслу, не по источнику; цель, стыки, запреты; без дословных цитат и воды"
    weight: 3
    anchors:
      1: "Контекст — свалка выдержек из документов или краткая приписка «сделай по спеке»; реализация потребует догадок"
      3: "Смысловое ядро есть и уложено в бюджет, но стыки/ограничения покрыты частично; кое-где копипаста вместо дистиллята"
      5: "800–1500 токенов чистого смысла: цель, контракты стыков, ограничения; агент реализует без доступа к источникам и без архитектурных изобретений"
  - id: invariants
    name: Инварианты и запреты
    description: "Связывающие AD из spine переданы дословно (Rule), явно перечислено, что менять запрещено"
    weight: 2
    anchors:
      1: "Инварианты не переданы; исполнитель волен переизобрести контракты и форматы"
      3: "Инварианты перечислены, но пересказаны (потеряна точность Rule) или без запретов на вне-scope изменения"
      5: "Все связывающие AD присутствуют с дословными Rule; явный список запрещённых к изменению решений; конфликт с spine обязан останавливать работу"
  - id: acceptance_criteria
    name: Критерии приёмки
    description: "Проверяемые критерии, включая негативные сценарии (дубль, отказ соседа, гонка) и критерий отката"
    weight: 2
    anchors:
      1: "Критерии отсутствуют или непроверяемы («работает корректно»)"
      3: "Критерии измеримы, но только позитивные; негативные сценарии и откат не покрыты"
      5: "Каждый критерий проверяем тестом/командой; негативные сценарии перечислены; есть явный критерий успешного отката"
  - id: result_contract
    name: Контракт результата (headless JSON)
    description: "Требование завершить прогон JSON-статусом complete/partial/blocked с assumptions/open_questions/conflicts_with_prior_decisions"
    weight: 2
    anchors:
      1: "Формат результата не задан; итог прогона — проза, которую нельзя обработать машинально"
      3: "JSON-статус требуется, но поля assumptions/open_questions/conflicts не объяснены или не обязательны"
      5: "Контракт полный и объяснённый: статус + три списка; conflicts_with_prior_decisions обязан останавливать и эскалировать; при blocked перечислены недостающие входы"
  - id: rollback_plan
    name: План отката
    description: "Как откатывается результат эпика, что считается сигналом отката, кто принимает решение"
    weight: 1
    anchors:
      1: "Плана отката нет — пакет не имеет права уходить в работу"
      3: "Откат упомянут одной фразой; сигналы и владелец решения не названы"
      5: "Пошаговый откат с сигналами-триггерами и владельцем решения; обратимость согласована с оценкой в ADR"
