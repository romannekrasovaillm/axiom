# Настройки кейса AXIOM для arch-be (харнесс архитектурного контроля).
# Порядок поиска: --config → ./arch-harness.toml → ~/.config/arch-harness/config.toml.
#
# Включён arch_drift (K6): единственный детектор архитектурного дрейфа во
# времени (снимки ревизий git); по умолчанию выключен как «дорогая» проверка.
# Для MFU-кампании включён осознанно: шаг и слои переписываются (ADR-047/048),
# и дрейф рёбер «модель ↔ код» обязан ловиться механически.
# Находки arch_drift вне [gate.required] — warn (решающий вердикт не меняют).

[gate.arch_drift]
enabled = true
