# Настройки кейса AXIOM для arch-be (харнесс архитектурного контроля).
# Порядок поиска: --config → ./arch-harness.toml → ~/.config/arch-harness/config.toml.
#
# arch_drift (K6) включён осознанно: единственный детектор архитектурного
# дрейфа во времени (снимки ревизий git); для MFU-кампании (ADR-047/048
# переписывают шаг и слои) дрейф рёбер «модель ↔ код» обязан ловиться.
# Кейс большой: рабочее дерево ~15.7k файлов (env/ ~11k — среды RL,
# evidence/ ~3k — артефакты прогонов), поэтому поднят потолок bounded-работы
# (ADR-046 Am.2) и заданы подстрочные исключения служебных масс.
#
# requires-правила (ADR-046): правила с `requires: [cuda]`/`[stand]` вне стенда
# дают SKIP с причиной и печатают «требуется прогон на GB10»; на GB10 —
# обычные PASS/FAIL. Реестр зондов — [gate.requires.<имя>] (общий атрибут;
# встроенные cuda/stand переопределяются здесь при необходимости).

[gate.arch_drift]
enabled = true
max_files = 20000
ignore = [
  "env/data",
  "env/data-regen",
  "evidence/a4-run-wire",
]
