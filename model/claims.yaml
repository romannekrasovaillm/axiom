# model/claims.yaml — реестр утверждений поведенческого слоя Spine (ADR-037, дельта A).
#
# Утверждение (CL-NNN): дословный anchor первоисточника + предикат над фактом
# датчика. Вердикт выносит tools/check_claims.py (pass | fail | unverified).
# Утверждение с sensor читается из evidence/facts/<S-id>.jsonl; утверждение с
# pending — отложено честно (владелец и срок объявлены), не подставлено.
#
# kind:
#   number         — числовое значение/порог;
#   bound          — ограничение (≤/≥);
#   obligation     — обязательство (должно быть true);
#   config_binding — декларация конфига (сверяется в --mode config-bindings).
#
# property/params (ADR-039, дельта P3): если задан property, --evaluate
# применяет шаблон каталога (tools/properties/**), а predicate игнорируется.
# Прежний predicate сохранён для сверки перевода (дельта P4) и обратной
# совместимости. CL-017 остаётся на predicate: свойство «значение снято»
# (presence) вне каталога — кандидат на тринадцатый шаблон (open_questions).

- id: CL-001
  source: {file: docs/adr/ADR-032-kda-wyut-tok-s-kpi-bolshoy-batch.md, anchor: "**≥800 ток/с** (10×, порог приёмки дельты WY/UT+батча)"}
  statement: "KPI претрейна: приёмка WY/UT от ≥800 ток/с (10× базиса 80–86)"
  kind: bound
  sensor: S-012
  fact: tok_s_median_window
  predicate:
    op: ">="
    value: 800
    unit: tok_s
    tolerance: 0.05
    window: {stat: median, n: 50, skip_warmup: 20}
    tolerance_source: {decision: "ADR-032 KPI + прецедент политики допусков _SCAN_FORM_ATOL"}
  property: bounds
  params:
    fact: S-012.tok_s_median_window
    min: 800
    window: {stat: median, n: 50, skip_warmup: 20}
    tolerance: 0.05
    tolerance_source: {decision: "ADR-032 KPI + прецедент политики допусков _SCAN_FORM_ATOL"}
  conditions:
    - {fact: S-018.model_loads_count, op: "==", value: 1}
  series: true
  subject_match: [run_ref]
  rule: C-050
  binding: null
  stake: money
  stake_note: "KPI ток/с открывает аренду и стадии; ошибка = расход без приёмки (ADR-032/038)"

