# model/claims.yaml — реестр утверждений поведенческого слоя Spine (ADR-037, дельта A).
#
# Утверждение (CL-NNN): дословный anchor первоисточника + предикат над фактом
# датчика. Вердикт выносит tools/check_claims.py (pass | fail | unverified).
# Утверждение с sensor читается из evidence/facts/<S-id>.jsonl; утверждение с
# pending — отложено честно (владелец и срок объявлены), не подставлено.
#
# kind:
#   number         — числовое значение/порог;
#   bound          — ограничение (≤/≥);
#   obligation     — обязательство (должно быть true);
#   config_binding — декларация конфига (сверяется в --mode config-bindings).

