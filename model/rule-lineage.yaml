# model/rule-lineage.yaml — наследование прозаических правил (ADR-038, дельта I).
#
# Для каждого правила CONSTRAINTS.yaml с kind: documentary — либо successor
# (поведенческое/структурное правило, наследующее смысл), либо none / pending с
# непустой причиной. Реестр отдельный (не поля в CONSTRAINTS: парсер arch-ml не
# должен встретить неизвестные ключи). Проверка: tools/check_claims.py --verify-layer.
# Наследники не выдуманы: successor указан там, где смысл прозы уже форсится
# механически; остальное — none (непроверяемо механически) или pending (наследник
# не построен, владелец и срок объявлены). Поля successor|none|pending —
# взаимоисключающие, ровно одно на запись; covers описывает, что в прозе
# остаётся каркасом.

- rule: C-001
  none:
    reason: "качество секции Alternatives — суждение о полноте; механический наследник потребовал бы LLM-судьи, что запрещено AD-2"
  covers: "обязательность секции Alternatives у каждого ADR"

- rule: C-002
  none:
    reason: "содержательность секции Negative — суждение; механически проверяется лишь наличие секции, не её сила"
  covers: "обязательность секции Negative у каждого ADR"

- rule: C-003
  none:
    reason: "объявленная обратимость — суждение о честности оценки; поведенческого наследника нет"
  covers: "обязательность секции Reversibility у каждого ADR"

- rule: C-004
  pending:
    reason: "поле **Rule** в model/AD-*.md проверяет trace_check (звено AD → fitness), но это не fitness-правило; вынос в механическое правило — решение архитектора"
    owner: owner
    since: 2026-10-07
  covers: "наличие проверяемого Rule у каждого спинального инварианта"

- rule: C-005
  pending:
    reason: "verified_by/unverifiable частично форсит C-036 (мета-валидатор стражей), но полного поведенческого наследника нет"
    owner: owner
    since: 2026-10-07
  covers: "привязка AD к fitness-правилу или честное unverifiable"

- rule: C-006
  pending:
    reason: "пары Binds/Prevents проверяет spine_lint, не fitness-правило; механический наследник в CONSTRAINTS не построен"
    owner: owner
    since: 2026-10-07
  covers: "полнота полей Binds и Prevents в блоках AD-n"

- rule: C-007
