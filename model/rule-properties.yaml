  params: {series: {fact: S-036.claim_verdict_history}, direction: up}
  migration: wrapped
  reason: "здоровье ряда награды RL (вырождение/энтропия); ряд публикуется прогоном RL, шаблон применим к обёрнутому ряду"

- rule: C-046
