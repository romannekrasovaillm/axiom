  reason: "блокировка аренды при unmet KPI — свойство «одобренная смета при unmet»; шаблон safety применим к обёрнутому факту сметы, страж читает сырьё evidence/budget"

- rule: C-049
  property: declared_equals_actual
  params: {declared: {file: net/config.json, key: num_kda_layers}, actual: {fact: S-001.num_kda_layers}}
