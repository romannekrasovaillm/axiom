  facts: [num_kda_layers, num_mla_layers, moe_top_k, moe_routed, moe_shared, vocab_size, kda_impl_selected]
  context: "cpu | gpu-window | stand-sampler | rental | live-probe | repo"
  producer: "python3 -m tools.sensors.runtime_config"
  output: evidence/facts/S-001.jsonl
  quality: measured
  freshness_max_h: null
  zone: line-1
  status: active
  pack: ml
  raw: {path: net/config.json, format: json, retention_days: null, in_git: true}

