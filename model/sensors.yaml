# model/sensors.yaml — реестр датчиков поведенческого слоя Spine (ADR-037, ADR-038).
#
# Датчик измеряет и пишет запись факта (evidence/facts/<S-id>.jsonl); вердикт
# выносит предикат утверждения (model/claims.yaml, tools/check_claims.py).
# Проверка исполнения реестра: python3 -m tools.sensors.probe
# Происхождение до сырья: python3 -m tools.sensors.probe --raw (ADR-038, дельта F).
#
# Статусы:
#   active  — датчик реализован; probe требует файл фактов по контракту;
#   pending — датчик объявлен, но не исполнялся (нет источника/окна/линии);
#             probe даёт unverified, а не подстановку (C-007).
# freshness_max_h: null = факт привязан к пину предмета (git sha/хеш), а не ко
#   времени; число = часы, после которых запись считается устаревшей.
#
# pack: доменный пакет (дельта G) — существующие датчики остаются в ядре и
#   помечаются pack: ml; новые экспортёры живут в tools/sensors/packs/<pack>/.
# raw: происхождение факта (дельта F) — {path, format, retention_days, in_git}
#   или {note} для датчиков без отдельного сырья (derived/таймирование/обход ФС).
#   path может быть glob; retention_days: null = бессрочно; in_git: false —
#   тяжёлое сырьё вне git (C-032). Селектор фрагмента задаётся в записи факта
#   (raw_ref.selector: 'lines A-B' | 'key <dotted>' | пусто = весь файл).

